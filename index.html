<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something For You ❤️</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffe5ee, #fff5f8);
  color: #572636;
  text-align: center;
}

.page {
  min-height: 100vh;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.heart {
  font-size: 85px;
  margin-bottom: 15px;
  animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {

  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

}

h1 {
  font-size: 46px;
  margin: 10px 0 20px;
  line-height: 1.2;
}

.subtitle {
  font-size: 21px;
  line-height: 1.6;
  margin-bottom: 40px;
}

.open-button {
  display: inline-block;
  text-decoration: none;
  background: #d94d76;
  color: white;
  padding: 18px 38px;
  font-size: 20px;
  font-family: Georgia, serif;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(217,77,118,0.3);
}

.message {
  min-height: 100vh;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.message-box {
  max-width: 650px;
  width: 100%;
  background: rgba(255,255,255,0.85);
  padding: 40px 25px;
  border-radius: 25px;
  box-shadow: 0 10px 35px rgba(100,40,60,0.15);
}

.message-box h2 {
  font-size: 36px;
  margin-top: 0;
  margin-bottom: 25px;
}

.message-box p {
  font-size: 20px;
  line-height: 1.8;
  margin: 18px 0;
}

@media (max-width:600px) {

  .heart {
    font-size: 75px;
  }

  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 19px;
  }

  .message-box h2 {
    font-size: 31px;
  }

  .message-box p {
    font-size: 18px;
  }

}

</style>

</head>

<body>

<!-- FIRST PAGE -->

<section class="page">

  <div class="heart">
    ❤️
  </div>

  <h1>
    Hey<br>
    Zayduuuuuu...
  </h1>

  <div class="subtitle">

    Wait... don't leave yet. 👀

    <br><br>

    Someone made a little something

    <br>

    especially for you.

  </div>

  <a class="open-button" href="#message">
    Open it ❤️
  </a>

</section>


<!-- SECOND PAGE -->

<section class="message" id="message">

  <div class="message-box">

    <div class="heart">
      💗
    </div>

    <h2>
      For You, Zayduuuu ❤️
    </h2>

    <p>
      I don't really know how to put everything I feel into words...
    </p>

    <p>
      But I wanted to make this little something for you, just because you are special to me. 🥹❤️
    </p>

  </div>

</section>

</body>

</html>
