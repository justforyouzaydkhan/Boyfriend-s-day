<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ffe5ee, #fff5f8);
      color: #572636;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;
    }

    .message-box {
      max-width: 650px;
      width: 100%;

      background: rgba(255, 255, 255, 0.85);

      padding: 40px 25px;

      border-radius: 25px;

      box-shadow:
        0 10px 35px rgba(100, 40, 60, 0.15);
    }

    .heart {
      font-size: 75px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.3;
      margin-top: 0;
      margin-bottom: 28px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
      margin: 18px 0;
    }

    @media (max-width: 600px) {

      .heart {
        font-size: 65px;
      }

      h1 {
        font-size: 29px;
      }

      p {
        font-size: 18px;
        line-height: 1.7;
      }

    }

  </style>

</head>

<body>

  <div class="message-box">

    <div class="heart">
      💗
    </div>

    <h1>
      For You, Zayduuuu ❤️
    </h1>

    <p>
      I don't really know how to put everything I feel into words...
    </p>

    <p>
      But I wanted to make this little something for you, just because you are special to me. 🥹❤️
    </p>

  </div>

</body>

</html>
