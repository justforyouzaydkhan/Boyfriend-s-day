<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Something For You ❤️</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ffe5ee, #fff5f8);
      color: #572636;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .heart {
      font-size: 85px;
      margin-bottom: 15px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    h1 {
      font-size: 46px;
      margin: 10px 0 20px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 21px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* OPEN BUTTON */

    .open-button {
      display: inline-block;
      text-decoration: none;
      border: none;
      background: #d94d76;
      color: white;
      padding: 18px 38px;
      font-size: 20px;
      font-family: Georgia, serif;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(217, 77, 118, 0.3);
    }

    .open-button:active {
      transform: scale(0.95);
    }

    @media (max-width: 600px) {

      .heart {
        font-size: 75px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 19px;
      }

    }

  </style>

</head>

<body>

  <section class="page">

    <div class="heart">
      ❤️
    </div>

    <h1>
      Hey<br>
      Zayduuuuuu...
    </h1>

    <div class="subtitle">

      Wait... don't leave yet. 👀

      <br><br>

      Someone made a little something

      <br>

      especially for you.

    </div>

    <!-- THIS IS A NORMAL LINK -->
    <a class="open-button" href="message.html">
      Open it ❤️
    </a>

  </section>

</body>

</html>
